[project]
name = "owasp-llm-demos"
version = "0.1.0"
description = "Small, runnable Python demonstrations for the OWASP Top 10 for LLM Applications (2026)"
readme = "README.md"
authors = [
    { name = "Leakey Maina", email = "leakeymaina@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "langchain>=1.5.0,<2.0.0",
    "langchain-core>=1.8.2,<2.0.0",
    "langchain-openai>=1.8.1,<2.0.0",
    "langgraph>=1.2.22,<2.0.0",
]

[project.scripts]
owasp = "owasp:main"

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
